apiVersion: v1
kind: Service
metadata:
  name: contractriskedge-api
  namespace: contractriskedge
  labels:
    app: contractriskedge
    component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: metrics
      port: 8001
      targetPort: 8001
      protocol: TCP
  selector:
    app: contractriskedge
    component: api
