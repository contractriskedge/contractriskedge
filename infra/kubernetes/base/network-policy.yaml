apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: contractriskedge-default-deny
  namespace: contractriskedge
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: contractriskedge-api-ingress
  namespace: contractriskedge
spec:
  podSelector:
    matchLabels:
      app: contractriskedge
      component: api
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8001
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 5432
        - port: 6379
        - port: 443
        - port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: contractriskedge-worker-egress
  namespace: contractriskedge
spec:
  podSelector:
    matchLabels:
      app: contractriskedge
      component: worker
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 5432
        - port: 6379
        - port: 443
        - port: 80
