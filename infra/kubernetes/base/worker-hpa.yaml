apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: contractriskedge-worker
  namespace: contractriskedge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: contractriskedge-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
