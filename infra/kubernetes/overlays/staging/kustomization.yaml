apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: contractriskedge

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: contractriskedge-api
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: contractriskedge-worker
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
    target:
      kind: HorizontalPodAutoscaler
      name: contractriskedge-api

configMapGenerator:
  - name: contractriskedge-config
    behavior: merge
    literals:
      - APP_ENV=staging
      - LOG_LEVEL=DEBUG
      - AI_DEFAULT_MODEL=gpt-4o-mini
