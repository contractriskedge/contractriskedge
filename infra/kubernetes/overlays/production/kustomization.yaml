apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: contractriskedge

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
    target:
      kind: Deployment
      name: contractriskedge-api
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 10
    target:
      kind: Deployment
      name: contractriskedge-worker
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 5
    target:
      kind: HorizontalPodAutoscaler
      name: contractriskedge-api
  - patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 30
    target:
      kind: HorizontalPodAutoscaler
      name: contractriskedge-worker

configMapGenerator:
  - name: contractriskedge-config
    behavior: merge
    literals:
      - APP_ENV=production
      - LOG_LEVEL=INFO
