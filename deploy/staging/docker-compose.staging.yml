version: "3.9"

# ── ContractRiskEdge Staging Environment ─────────────────────────
#
# Production-like staging stack for REAL load validation.
#
# Features:
#   - 3x API replicas (behind internal round-robin)
#   - 4x worker replicas (separate queue groups)
#   - Redis (broker + cache + rate-limit + session)
#   - Postgres 16 + pgvector
#   - WebSocket-enabled
#   - OpenTelemetry collector
#   - Prometheus + Grafana
#   - MinIO (S3-compatible storage)
#   - Locust (distributed mode: master + workers)
#
# Usage:
#   docker compose -f deploy/staging/docker-compose.staging.yml up -d
#   docker compose -f deploy/staging/docker-compose.staging.yml logs -f
#
# Teardown:
#   docker compose -f deploy/staging/docker-compose.staging.yml down -v
#
# Access:
#   API:            http://localhost:8000
#   API (replica2): http://localhost:8001
#   API (replica3): http://localhost:8002
#   Grafana:        http://localhost:3001  (admin / admin)
#   Prometheus:     http://localhost:9090
#   MinIO Console:  http://localhost:9001  (minioadmin / minioadmin)
#   Flower:         http://localhost:5555
#   Locust Web UI:  http://localhost:8089
#
# Load test execution:
#   # Web UI mode:
#   docker compose -f deploy/staging/docker-compose.staging.yml exec locust-master locust -f /tests/locustfile.py --web-host 0.0.0.0
#
#   # Headless sustained load (1hr):
#   docker compose -f deploy/staging/docker-compose.staging.yml exec locust-master \
#     locust -f /tests/locustfile.py --headless \
#     --users 200 --spawn-rate 10 --run-time 3600s \
#     --host http://api:8000 \
#     --csv=/reports/sustained_load
#
#   # Burst test (10x spike):
#   docker compose -f deploy/staging/docker-compose.staging.yml exec locust-master \
#     locust -f /tests/locustfile.py:BurstLoadUser --headless \
#     --users 50 --spawn-rate 50 --run-time 300s \
#     --host http://api:8000 \
#     --csv=/reports/burst_load
#
#   # Ingestion flood:
#   docker compose -f deploy/staging/docker-compose.staging.yml exec locust-master \
#     locust -f /tests/locustfile.py:IngestionFloodUser --headless \
#     --users 30 --spawn-rate 5 --run-time 600s \
#     --host http://api:8000 \
#     --csv=/reports/ingestion_flood
#
#   # WebSocket storm:
#   docker compose -f deploy/staging/docker-compose.staging.yml exec locust-master \
#     locust -f /tests/locustfile.py:WebSocketStormUser --headless \
#     --users 100 --spawn-rate 20 --run-time 300s \
#     --host http://api:8000 \
#     --csv=/reports/websocket_storm
#
#   # Multi-tenant isolation:
#   docker compose -f deploy/staging/docker-compose.staging.yml exec locust-master \
#     locust -f /tests/locustfile.py:MultiTenantUser --headless \
#     --users 200 --spawn-rate 20 --run-time 600s \
#     --host http://api:8000 \
#     --csv=/reports/multi_tenant
#
#   # Executive dashboard pressure:
#   docker compose -f deploy/staging/docker-compose.staging.yml exec locust-master \
#     locust -f /tests/locustfile.py:ExecutiveDashboardPressureUser --headless \
#     --users 50 --spawn-rate 10 --run-time 600s \
#     --host http://api:8000 \
#     --csv=/reports/dashboard_pressure
#
#   # Chaos: kill worker replicas during load
#   docker compose -f deploy/staging/docker-compose.staging.yml stop worker-ai worker-ingestion
#   # ... observe degradation, then:
#   docker compose -f deploy/staging/docker-compose.staging.yml start worker-ai worker-ingestion
#   # ... observe recovery

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ═══════════════════════════════════════════════════════════════
  # DATABASE
  # ═══════════════════════════════════════════════════════════════

  postgres:
    image: pgvector/pgvector:pg16
    container_name: cre-staging-postgres
    environment:
      POSTGRES_DB: contract_risk_staging
      POSTGRES_USER: staging_user
      POSTGRES_PASSWORD: staging_password_2024
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - pg_staging_data:/var/lib/postgresql/data
      - ../../infra/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../../infra/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staging_user -d contract_risk_staging"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: "4g"
        reservations:
          cpus: "2.0"
          memory: "2g"
    logging: *default-logging
    networks:
      - cre-staging

  # ═══════════════════════════════════════════════════════════════
  # REDIS
  # ═══════════════════════════════════════════════════════════════

  redis:
    image: redis:7-alpine
    container_name: cre-staging-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2g"
        reservations:
          cpus: "1.0"
          memory: "1g"
    logging: *default-logging
    networks:
      - cre-staging

  # ═══════════════════════════════════════════════════════════════
  # MINIO (S3-compatible object storage)
  # ═══════════════════════════════════════════════════════════════

  minio:
    image: minio/minio:latest
    container_name: cre-staging-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_staging_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1g"
    logging: *default-logging
    networks:
      - cre-staging

  # ═══════════════════════════════════════════════════════════════
  # API REPLICAS (3x for load balancing)
  # ═══════════════════════════════════════════════════════════════

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: cre-staging-api-1
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://staging_user:staging_password_2024@postgres:5432/contract_risk_staging
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: staging-secret-key-do-not-use-in-production
      DEV_JWT_SECRET: staging-dev-jwt-secret
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-staging.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.contractriskanalyzer.com}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-https://staging.auth0.com/}
      LOG_LEVEL: INFO
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: contractrisk-api
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: contract-staging-uploads
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_ANONYMOUS: "20/minute"
      RATE_LIMIT_AUTHENTICATED: "200/minute"
      RATE_LIMIT_ADMIN: "1000/minute"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000","http://localhost:8001","http://localhost:8002"]'
    volumes:
      - ../../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --loop uvloop --http httptools
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: "4g"
        reservations:
          cpus: "2.0"
          memory: "2g"
    logging: *default-logging
    networks:
      - cre-staging

  api-replica-2:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: cre-staging-api-2
    ports:
      - "8001:8000"
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://staging_user:staging_password_2024@postgres:5432/contract_risk_staging
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: staging-secret-key-do-not-use-in-production
      DEV_JWT_SECRET: staging-dev-jwt-secret
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-staging.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.contractriskanalyzer.com}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-https://staging.auth0.com/}
      LOG_LEVEL: INFO
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: contractrisk-api
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: contract-staging-uploads
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_ANONYMOUS: "20/minute"
      RATE_LIMIT_AUTHENTICATED: "200/minute"
      RATE_LIMIT_ADMIN: "1000/minute"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000","http://localhost:8001","http://localhost:8002"]'
    volumes:
      - ../../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --loop uvloop --http httptools
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: "4g"
        reservations:
          cpus: "2.0"
          memory: "2g"
    logging: *default-logging
    networks:
      - cre-staging

  api-replica-3:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: cre-staging-api-3
    ports:
      - "8002:8000"
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://staging_user:staging_password_2024@postgres:5432/contract_risk_staging
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: staging-secret-key-do-not-use-in-production
      DEV_JWT_SECRET: staging-dev-jwt-secret
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-staging.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.contractriskanalyzer.com}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-https://staging.auth0.com/}
      LOG_LEVEL: INFO
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: contractrisk-api
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: contract-staging-uploads
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_ANONYMOUS: "20/minute"
      RATE_LIMIT_AUTHENTICATED: "200/minute"
      RATE_LIMIT_ADMIN: "1000/minute"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000","http://localhost:8001","http://localhost:8002"]'
    volumes:
      - ../../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --loop uvloop --http httptools
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: "4g"
        reservations:
          cpus: "2.0"
          memory: "2g"
    logging: *default-logging
    networks:
      - cre-staging

  # ═══════════════════════════════════════════════════════════════
  # WORKER REPLICAS (separate queue groups)
  # ═══════════════════════════════════════════════════════════════

  worker-ingestion:
    build:
      context: ../../backend
      dockerfile: Dockerfile.worker
    container_name: cre-staging-worker-ingestion
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://staging_user:staging_password_2024@postgres:5432/contract_risk_staging
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: contractrisk-worker-ingestion
      LOG_LEVEL: INFO
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: contract-staging-uploads
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    volumes:
      - ../../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Q ingestion --hostname=ingestion@%h
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: "4g"
        reservations:
          cpus: "2.0"
          memory: "2g"
    logging: *default-logging
    networks:
      - cre-staging

  worker-ai:
    build:
      context: ../../backend
      dockerfile: Dockerfile.worker
    container_name: cre-staging-worker-ai
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://staging_user:staging_password_2024@postgres:5432/contract_risk_staging
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: contractrisk-worker-ai
      LOG_LEVEL: INFO
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: contract-staging-uploads
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    volumes:
      - ../../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Q ai --hostname=ai@%h
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: "4g"
        reservations:
          cpus: "2.0"
          memory: "2g"
    logging: *default-logging
    networks:
      - cre-staging

  worker-notifications:
    build:
      context: ../../backend
      dockerfile: Dockerfile.worker
    container_name: cre-staging-worker-notifications
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://staging_user:staging_password_2024@postgres:5432/contract_risk_staging
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: contractrisk-worker-notifications
      LOG_LEVEL: INFO
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: contract-staging-uploads
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    volumes:
      - ../../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Q notifications,default --hostname=notifications@%h
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2g"
        reservations:
          cpus: "1.0"
          memory: "1g"
    logging: *default-logging
    networks:
      - cre-staging

  worker-embeddings:
    build:
      context: ../../backend
      dockerfile: Dockerfile.worker
    container_name: cre-staging-worker-embeddings
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://staging_user:staging_password_2024@postgres:5432/contract_risk_staging
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: contractrisk-worker-embeddings
      LOG_LEVEL: INFO
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: contract-staging-uploads
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    volumes:
      - ../../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Q embeddings --hostname=embeddings@%h
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: "4g"
        reservations:
          cpus: "2.0"
          memory: "2g"
    logging: *default-logging
    networks:
      - cre-staging

  # ═══════════════════════════════════════════════════════════════
  # CELERY BEAT (scheduler)
  # ═══════════════════════════════════════════════════════════════

  celery-beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile.worker
    container_name: cre-staging-celery-beat
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://staging_user:staging_password_2024@postgres:5432/contract_risk_staging
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LOG_LEVEL: INFO
    volumes:
      - ../../backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler celery.beat.PersistentScheduler
    logging: *default-logging
    networks:
      - cre-staging

  # ═══════════════════════════════════════════════════════════════
  # FLOWER (Celery monitoring)
  # ═══════════════════════════════════════════════════════════════

  flower:
    image: mher/flower:2.0
    container_name: cre-staging-flower
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      FLOWER_PORT: "5555"
      FLOWER_BASIC_AUTH: "admin:stagingflower2024"
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging
    networks:
      - cre-staging

  # ═══════════════════════════════════════════════════════════════
  # OPENTELEMETRY COLLECTOR
  # ═══════════════════════════════════════════════════════════════

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: cre-staging-otel-collector
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics from collector
      - "8889:8889"   # Collector health
    volumes:
      - ./otel-collector.yml:/etc/otel-collector-config.yml:ro
    command: ["--config=/etc/otel-collector-config.yml"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1g"
    logging: *default-logging
    networks:
      - cre-staging

  # ═══════════════════════════════════════════════════════════════
  # PROMETHEUS
  # ═══════════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cre-staging-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.staging.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_staging_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1g"
    logging: *default-logging
    networks:
      - cre-staging

  # ═══════════════════════════════════════════════════════════════
  # GRAFANA
  # ═══════════════════════════════════════════════════════════════

  grafana:
    image: grafana/grafana:11.1.0
    container_name: cre-staging-grafana
    restart: unless-stopped
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_staging_data:/var/lib/grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_DEFAULT_THEME=dark
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512m"
    logging: *default-logging
    networks:
      - cre-staging

  # ═══════════════════════════════════════════════════════════════
  # LOCUST (distributed load testing)
  # ═══════════════════════════════════════════════════════════════

  locust-master:
    image: locustio/locust:2.31.0
    container_name: cre-staging-locust-master
    ports:
      - "8089:8089"   # Web UI
      - "5557:5557"   # Master-worker comm
    volumes:
      - ../../tests/load:/tests:ro
      - ../../tests/load/reports:/reports
    command: locust -f /tests/locustfile.py --master --web-host 0.0.0.0 --web-port 8089
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1g"
    logging: *default-logging
    networks:
      - cre-staging

  locust-worker-1:
    image: locustio/locust:2.31.0
    container_name: cre-staging-locust-worker-1
    volumes:
      - ../../tests/load:/tests:ro
    command: locust -f /tests/locustfile.py --worker --master-host locust-master
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2g"
    depends_on:
      - locust-master
    logging: *default-logging
    networks:
      - cre-staging

  locust-worker-2:
    image: locustio/locust:2.31.0
    container_name: cre-staging-locust-worker-2
    volumes:
      - ../../tests/load:/tests:ro
    command: locust -f /tests/locustfile.py --worker --master-host locust-master
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2g"
    depends_on:
      - locust-master
    logging: *default-logging
    networks:
      - cre-staging

  locust-worker-3:
    image: locustio/locust:2.31.0
    container_name: cre-staging-locust-worker-3
    volumes:
      - ../../tests/load:/tests:ro
    command: locust -f /tests/locustfile.py --worker --master-host locust-master
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2g"
    depends_on:
      - locust-master
    logging: *default-logging
    networks:
      - cre-staging

  locust-worker-4:
    image: locustio/locust:2.31.0
    container_name: cre-staging-locust-worker-4
    volumes:
      - ../../tests/load:/tests:ro
    command: locust -f /tests/locustfile.py --worker --master-host locust-master
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2g"
    depends_on:
      - locust-master
    logging: *default-logging
