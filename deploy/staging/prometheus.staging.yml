# ── Prometheus Configuration for ContractRiskEdge Staging ────────
# Scrapes all API replicas, workers, OTel collector, and infrastructure.

global:
  scrape_interval:     10s
  evaluation_interval: 10s
  external_labels:
    monitor: "contractriskedge-staging"
    environment: "staging"

# Alerting rules
rule_files:
  - "alerts/*.yml"

scrape_configs:

  # ── API Replicas ────────────────────────────────────────────────
  - job_name: "cre-api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "api:8000"
          - "api-replica-2:8000"
          - "api-replica-3:8000"
        labels:
          service: "api"
          environment: "staging"

  # ── Celery Workers ──────────────────────────────────────────────
  - job_name: "cre-workers"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "worker-ingestion:9100"
          - "worker-ai:9100"
          - "worker-notifications:9100"
          - "worker-embeddings:9100"
        labels:
          service: "workers"
          environment: "staging"

  # ── OpenTelemetry Collector ─────────────────────────────────────
  - job_name: "cre-otel-collector"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "otel-collector:8888"
          - "otel-collector:8889"
        labels:
          service: "otel-collector"
          environment: "staging"

  # ── Redis ───────────────────────────────────────────────────────
  - job_name: "cre-redis"
    static_configs:
      - targets:
          - "redis:6379"
        labels:
          service: "redis"
          environment: "staging"

  # ── Postgres ────────────────────────────────────────────────────
  - job_name: "cre-postgres"
    static_configs:
      - targets:
          - "postgres:5432"
        labels:
          service: "postgres"
          environment: "staging"

  # ── Locust ──────────────────────────────────────────────────────
  - job_name: "cre-locust"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "locust-master:8089"
        labels:
          service: "locust"
          environment: "staging"

  # ── Docker Engine ───────────────────────────────────────────────
  - job_name: "cre-docker"
    static_configs:
      - targets:
          - "host.docker.internal:9323"
        labels:
          service: "docker"
          environment: "staging"
