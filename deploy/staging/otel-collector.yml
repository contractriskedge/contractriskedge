# ── OpenTelemetry Collector Configuration ─────────────────────────
# Receives telemetry from API replicas, workers, and infrastructure.
# Exports to Prometheus (metrics) and console (traces/logs for debugging).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Scrape Prometheus endpoints from services
  prometheus:
    config:
      scrape_configs:
        - job_name: "otel-collector-self"
          scrape_interval: 15s
          static_configs:
            - targets: ["0.0.0.0:8888"]

  # Host metrics
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
      memory:
      disk:
      network:
      load:

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000
    send_batch_max_size: 2000

  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  # Add service metadata
  attributes:
    actions:
      - key: environment
        value: staging
        action: upsert
      - key: platform
        value: contractriskedge
        action: upsert

  # Sampling: keep all traces during load testing
  tail_sampling:
    policies:
      - name: keep-all-during-load-test
        type: always_sample

exporters:
  # Metrics to Prometheus
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: cre
    send_timestamps: true
    metric_expiration: 5m
    resource_to_telemetry_conversion:
      enabled: true

  # Logging exporter for debugging
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 100

  # OTLP backpressure (for future forwarding to cloud)
  otlp:
    endpoint: "http://prometheus:9090/api/v1/write"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [debug]
    metrics:
      receivers: [otlp, prometheus, hostmetrics]
      processors: [memory_limiter, batch, attributes]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [debug]
