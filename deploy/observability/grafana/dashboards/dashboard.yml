# ── Grafana Dashboard Provisioning ────────────────────────────────
apiVersion: 1

providers:
  - name: "ContractRiskEdge"
    orgId: 1
    folder: "ContractRiskEdge"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/contractriskedge
