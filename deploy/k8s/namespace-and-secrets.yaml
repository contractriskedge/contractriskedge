apiVersion: v1
kind: Namespace
metadata:
  name: contractrisk
  labels:
    name: contractrisk
    environment: production
---
apiVersion: v1
kind: Secret
metadata:
  name: contractrisk-secrets
  namespace: contractrisk
  labels:
    app: contractrisk
type: Opaque
stringData:
  # ⚠️ These are placeholders. Replace with real values via:
  #   kubectl create secret generic contractrisk-secrets \
  #     --namespace contractrisk \
  #     --from-literal=database_url="postgresql+asyncpg://..." \
  #     --from-literal=redis_url="redis://..." \
  #     --from-literal=celery_broker_url="redis://..." \
  #     --from-literal=celery_result_backend="redis://..." \
  #     --from-literal=auth0_domain="..." \
  #     --from-literal=auth0_audience="..." \
  #     --from-literal=auth0_issuer="..." \
  #     --from-literal=openai_api_key="..." \
  #     --from-literal=sentry_dsn="..." \
  #     --from-literal=s3_endpoint_url="..." \
  #     --from-literal=s3_access_key_id="..." \
  #     --from-literal=s3_secret_access_key="..." \
  #     --from-literal=auth0_secret="..." \
  #     --from-literal=auth0_issuer_base_url="..." \
  #     --from-literal=auth0_client_id="..." \
  #     --from-literal=auth0_client_secret="..."
  database_url: "postgresql+asyncpg://REPLACE:REPLACE@postgres:5432/contractrisk_prod"
  redis_url: "redis://REPLACE:6379/0"
  celery_broker_url: "redis://REPLACE:6379/1"
  celery_result_backend: "redis://REPLACE:6379/2"
  auth0_domain: "REPLACE.auth0.com"
  auth0_audience: "https://api.contractriskedge.com"
  auth0_issuer: "https://REPLACE.auth0.com/"
  openai_api_key: "sk-REPLACE"
  sentry_dsn: ""
  s3_endpoint_url: "https://s3.REPLACE.amazonaws.com"
  s3_access_key_id: "REPLACE"
  s3_secret_access_key: "REPLACE"
  auth0_secret: "REPLACE"
  auth0_issuer_base_url: "https://REPLACE.auth0.com"
  auth0_client_id: "REPLACE"
  auth0_client_secret: "REPLACE"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: contractrisk-config
  namespace: contractrisk
  labels:
    app: contractrisk
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  S3_BUCKET_NAME: "contractrisk-documents"
  APP_URL: "https://app.contractriskedge.com"
  NEXT_PUBLIC_API_URL: "https://api.contractriskedge.com/api/v1"
  AUTH0_BASE_URL: "https://app.contractriskedge.com"
