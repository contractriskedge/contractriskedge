apiVersion: apps/v1
kind: Deployment
metadata:
  name: contractrisk-frontend
  namespace: contractrisk
  labels:
    app: contractrisk
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: contractrisk
      tier: frontend
  template:
    metadata:
      labels:
        app: contractrisk
        tier: frontend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: contractrisk-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.contractriskedge.com/api/v1"
            - name: AUTH0_SECRET
              valueFrom:
                secretKeyRef:
                  name: contractrisk-secrets
                  key: auth0_secret
            - name: AUTH0_BASE_URL
              value: "https://app.contractriskedge.com"
            - name: AUTH0_ISSUER_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: contractrisk-secrets
                  key: auth0_issuer_base_url
            - name: AUTH0_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: contractrisk-secrets
                  key: auth0_client_id
            - name: AUTH0_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: contractrisk-secrets
                  key: auth0_client_secret
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: contractrisk-frontend
  namespace: contractrisk
  labels:
    app: contractrisk
    tier: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: contractrisk
    tier: frontend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: contractrisk-frontend
  namespace: contractrisk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: contractrisk-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: contractrisk-frontend
  namespace: contractrisk
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: contractrisk
      tier: frontend
