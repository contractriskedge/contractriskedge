apiVersion: apps/v1
kind: Deployment
metadata:
  name: contractrisk-api
  namespace: contractrisk
  labels:
    app: contractrisk
    tier: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: contractrisk
      tier: api
  template:
    metadata:
      labels:
        app: contractrisk
        tier: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: contractrisk-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: contractrisk-secrets
                  key: database_url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: contractrisk-secrets
                  key: redis_url
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: contractrisk-secrets
                  key: celery_broker_url
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: contractrisk-secrets
                  key: celery_result_backend
            - name: AUTH0_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: contractrisk-secrets
                  key: auth0_domain
            - name: AUTH0_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: contractrisk-secrets
                  key: auth0_audience
            - name: AUTH0_ISSUER
              valueFrom:
                secretKeyRef:
                  name: contractrisk-secrets
                  key: auth0_issuer
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: contractrisk-secrets
                  key: openai_api_key
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: contractrisk-secrets
                  key: sentry_dsn
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4318"
            - name: LOG_LEVEL
              value: "INFO"
            - name: S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: contractrisk-secrets
                  key: s3_endpoint_url
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: contractrisk-secrets
                  key: s3_access_key_id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: contractrisk-secrets
                  key: s3_secret_access_key
            - name: S3_BUCKET_NAME
              value: "contractrisk-documents"
            - name: APP_URL
              value: "https://app.contractriskedge.com"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: contractrisk-api
  namespace: contractrisk
  labels:
    app: contractrisk
    tier: api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: contractrisk
    tier: api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: contractrisk-api
  namespace: contractrisk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: contractrisk-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: contractrisk-api
  namespace: contractrisk
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: contractrisk
      tier: api
