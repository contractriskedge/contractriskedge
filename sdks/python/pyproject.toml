[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "contractai"
version = "1.0.0"
description = "Official Python SDK for the ContractRiskEdge API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27.0",
]
keywords = ["contract", "risk", "legal", "ai", "redline"]

[project.urls]
Homepage = "https://contractriskedge.com"
Documentation = "https://docs.contractriskedge.com"
Source = "https://github.com/contractriskedge/sdk-python"
